name: Update incident counter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate days
        id: days
        run: |
          START="2026-05-17"
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$START" +%s) ) / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          sed -i "s|<!-- INCIDENT_START -->.*<!-- INCIDENT_END -->|<!-- INCIDENT_START -->*⏱️ days since last production incident: **${{ steps.days.outputs.days }}***<!-- INCIDENT_END -->|" README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update incident counter"
          git push
